<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- macOS icon grid: an 824 px rounded square centred on a 1024 px canvas. The page's favicon, as an app icon. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0384c"/>
      <stop offset="1" stop-color="#c9142a"/>
    </linearGradient>
    <filter id="s" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#g)" filter="url(#s)"/>
  <circle cx="512" cy="512" r="190" fill="#fff"/>
  <circle cx="512" cy="512" r="250" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="28"/>
</svg>

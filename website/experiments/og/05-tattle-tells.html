<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>05 · Tattle tells</title>
<link rel="stylesheet" href="og.css">
<style>
  .hl { position: absolute; left: 48px; top: 158px; font-size: 118px; line-height: 0.88; }
  .cap { position: absolute; left: 48px; top: 400px; width: 700px; padding: 14px 22px 16px 18px; gap: 8px; }
  .cap .who { font-size: 16px; }
  .cap .said { font-size: 30px; }
  .stamp { position: absolute; left: 700px; top: 446px; }
  .stamp .fc-verdict { padding: 16px 40px 16px 22px; box-shadow: 0 18px 44px rgba(0, 0, 0, 0.5); }
  .stamp .fc-verdict .vw { font-size: 50px; }
  .top-url { position: absolute; right: 48px; top: 66px; font: 700 26px/1 var(--cond); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); }
  .meta { position: absolute; right: 48px; bottom: 40px; font: 700 22px/1 var(--cond); letter-spacing: 0.12em; text-transform: uppercase; color: var(--mute); }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><div class="onair"><i></i>On air</div><div class="strap"><span class="eyebrow"><span class="ca-mark" style="--s:18px"></span>Open-source Mac app</span><b class="name">Tattle</b></div></div>
  <div class="top-url">hey-tattle.com</div>

  <h1 class="hl">Say something wrong.<br><span class="red">Tattle will tell.</span></h1>

  <div class="cap host claim">
    <span class="who">Host · mic <span class="flag">Claim</span></span>
    <span class="said"><u>Lightning never strikes the same place twice.</u></span>
  </div>
  <div class="stamp v-contradicted"><div class="fc-verdict"><span class="vw">Contradicted</span><span class="vm">Sourced · in seconds</span></div></div>

  <div class="meta">Live fact-checks for your calls · Free Mac app</div>
</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>02 · The record key</title>
<link rel="stylesheet" href="og.css">
<style>
  /* the on-air floor rings, in the voices' colours, behind the key */
  .rings { position: absolute; left: 930px; top: 540px; }
  .rings i { position: absolute; border-radius: 50%; border: 5px solid var(--c); transform: translate(-50%, -50%); opacity: var(--o, 0.9); }
  .key { left: 600px; top: 18px; width: 610px; height: 620px; }
  .hl { position: absolute; left: 48px; top: 170px; font-size: 94px; }
  .offer { position: absolute; left: 48px; top: 470px; display: flex; align-items: center; gap: 22px; }
  .url { position: absolute; left: 48px; bottom: 40px; font: 700 26px/1 var(--cond); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); }
  .fc { position: absolute; left: 650px; top: 478px; }
  .fc-verdict { padding: 12px 28px 12px 16px; }
  .fc-verdict .vw { font-size: 30px; }
  .fc-verdict .vm { font-size: 12px; }
  .fc .restated { font-size: 23px; }
</style>
</head>
<body>
<div class="card">
  <div class="rings">
    <i style="--c: var(--remote); width: 1120px; height: 330px; --o: 0.6"></i>
    <i style="--c: var(--host); width: 940px; height: 270px; --o: 0.7"></i>
    <i style="--c: var(--accent); width: 770px; height: 215px; --o: 0.75"></i>
    <i style="--c: var(--ink); width: 610px; height: 165px; --o: 0.85"></i>
  </div>
  <div class="key"></div>

  <div class="brand"><div class="onair"><i></i>On air</div><div class="strap"><span class="eyebrow"><span class="ca-mark" style="--s:18px"></span>Open-source Mac app</span><b class="name">Tattle</b></div></div>

  <h1 class="hl">Press record.<br>Every claim<br><span class="red">gets checked.</span></h1>

  <div class="offer">
    <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="square"><path d="M12 3v12M6 10l6 6 6-6M4 21h16"/></svg>Free for Mac</span>
  </div>
  <div class="url">hey-tattle.com</div>

  <div class="fc v-contradicted">
    <div class="fc-verdict"><span class="vw">Contradicted</span><span class="vm">Sourced</span></div>
    <div class="fc-body"><p class="restated">"Bats are blind."</p></div>
  </div>
</div>
</body>
</html>

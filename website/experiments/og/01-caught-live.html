<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>01 · Caught live</title>
<link rel="stylesheet" href="og.css">
<style>
  .cap { position: absolute; left: 48px; top: 160px; width: 1000px; }
  .cap .said { font-size: 58px; }
  .fc { position: absolute; left: 150px; right: 48px; top: 360px; }
  .fc-verdict .vw { font-size: 52px; }
  .hl { position: absolute; left: 48px; bottom: 40px; font-size: 84px; }
  .top-url { position: absolute; right: 48px; top: 66px; font: 700 26px/1 var(--cond); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><div class="onair"><i></i>On air</div><div class="strap"><span class="eyebrow"><span class="ca-mark" style="--s:18px"></span>Open-source Mac app</span><b class="name">Tattle</b></div></div>
  <div class="top-url">hey-tattle.com</div>

  <div class="cap remote claim">
    <span class="who">Guest · call <span class="flag">Claim</span></span>
    <span class="said"><u>The Great Wall of China is visible from space.</u></span>
  </div>

  <div class="fc v-contradicted">
    <div class="fc-verdict"><span class="vw">Contradicted</span><span class="vm">Sourced</span></div>
    <div class="fc-body"><p class="restated">Not with the naked eye.</p><p class="correction">Astronauts report they can't see it.</p></div>
  </div>

  <h1 class="hl">Fact-checked <span class="red">while you talk.</span></h1>
</div>
</body>
</html>

# The Mac app's package (see docs/desktop.md). Build it with `npm run dist:mac`, which prepares everything below first.
# the bundle id keeps the name from before the rename to Tattle: macOS ties the permissions and updates to it
appId: com.cloudlesslabs.conversation-assistant
productName: Tattle
copyright: © 2026 Cloudless Consulting Pty Ltd
directories:
  output: out
  buildResources: desktop
# the app's code: the bundled engine and window, and the windows' preload (dist/desktop), the version (package.json), and the license
files:
  - dist/desktop/**
  - package.json
  - LICENSE
  - "!**/*.map"
# A signed app holds the user's Microphone and System Audio Recording grants. These fuses stop anyone relaunching it as
# plain Node (ELECTRON_RUN_AS_NODE), with NODE_OPTIONS, or with --inspect to use those grants, and check that the app's
# code is the one that was signed. Chromium's debugging port has no fuse: desktop/main.ts refuses it.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
# the page is in English only: drop Electron's other interface languages
electronLanguages: [en]
# sherpa-onnx's addon and its dylibs cannot load from inside the asar archive
asarUnpack:
  - node_modules/sherpa-onnx-*/**
extraResources:
  - from: web
    to: web
    filter: [index.html, licenses.html, styles.css, "dist/**/*.js", "fonts/**"]
  - from: config
    to: config
  - from: models
    to: models
    filter: ["*.onnx"]
  - from: native/capture/.build/release/tattle-capture
    to: bin/tattle-capture
  # the licenses: ours, every third-party component's (THIRD_PARTY_NOTICES.md, generated), and Electron's own
  - from: LICENSE
    to: licenses/LICENSE.txt
  - from: THIRD_PARTY_NOTICES.md
    to: licenses/THIRD_PARTY_NOTICES.txt
  - from: licenses
    to: licenses
  - from: node_modules/electron/dist/LICENSE
    to: licenses/LICENSE.electron.txt
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: licenses/LICENSES.chromium.html
mac:
  target:
    - target: dmg
      arch: arm64
    - target: zip # what auto-update downloads
      arch: arm64
  artifactName: Tattle-${version}-arm64-mac.${ext} # the zip; the DMG is named below
  category: public.app-category.productivity
  icon: desktop/icon.icns
  minimumSystemVersion: "14.2" # the Core Audio process tap
  hardenedRuntime: true
  entitlements: desktop/entitlements.mac.plist
  entitlementsInherit: desktop/entitlements.mac.plist
  notarize: true # with APPLE_KEYCHAIN_PROFILE, which scripts/build-mac.sh sets (or APPLE_API_KEY…, or APPLE_ID…)
  extendInfo:
    NSMicrophoneUsageDescription: Tattle transcribes the host's microphone during a recording.
    NSAudioCaptureUsageDescription: Tattle transcribes the call audio (co-hosts and guests) that the Mac plays during a recording.
dmg:
  title: Tattle
  artifactName: Tattle-${version}-arm64.${ext}
publish:
  provider: github
  owner: nicolasdao
  repo: tattle
  releaseType: release

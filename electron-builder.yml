# The Mac app's package (see docs/desktop.md). Build it with `npm run dist:mac`, which prepares everything below first.
appId: com.cloudlesslabs.conversation-assistant
productName: Conversation Assistant
copyright: © 2026 Cloudless Consulting Pty Ltd
directories:
  output: out
  buildResources: desktop
# the app's code: the bundled engine and window (dist/desktop), the version (package.json), and the license
files:
  - dist/desktop/**
  - package.json
  - LICENSE
  - "!**/*.map"
# the page is in English only: drop Electron's other interface languages
electronLanguages: [en]
# sherpa-onnx's addon and its dylibs cannot load from inside the asar archive
asarUnpack:
  - node_modules/sherpa-onnx-*/**
extraResources:
  - from: web
    to: web
    filter: [index.html, styles.css, "dist/**/*.js", "fonts/**"]
  - from: config
    to: config
  - from: models
    to: models
    filter: ["*.onnx"]
  - from: native/capture/.build/release/conversation-capture
    to: bin/conversation-capture
mac:
  target:
    - target: dmg
      arch: arm64
    - target: zip # what auto-update downloads
      arch: arm64
  artifactName: Conversation-Assistant-${version}-arm64-mac.${ext} # the zip; the DMG is named below
  category: public.app-category.productivity
  icon: desktop/icon.icns
  minimumSystemVersion: "14.2" # the Core Audio process tap
  hardenedRuntime: true
  entitlements: desktop/entitlements.mac.plist
  entitlementsInherit: desktop/entitlements.mac.plist
  notarize: true # needs APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER (or APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID)
  extendInfo:
    NSMicrophoneUsageDescription: Conversation Assistant transcribes the host's microphone during a recording.
    NSAudioCaptureUsageDescription: Conversation Assistant transcribes the call audio (co-hosts and guests) that the Mac plays during a recording.
dmg:
  title: Conversation Assistant
  artifactName: Conversation-Assistant-${version}-arm64.${ext}
publish:
  provider: github
  owner: nicolasdao
  repo: podcast-ai-assistant
  releaseType: release
